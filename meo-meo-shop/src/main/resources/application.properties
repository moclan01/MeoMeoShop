spring.application.name=meo-meo-shop

# C?u hình k?t n?i MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/meo-meo-shop?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# C?u hình Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
